name: IndexNow

# Vercel reports each deployment back to GitHub; ping IndexNow once production is live.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run indexnow
